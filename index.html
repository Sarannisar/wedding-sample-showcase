<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#b05570" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safiyya & Sharrafuth — Wedding Invitation</title>
    <meta name="description" content="You are cordially invited to the wedding ceremony of Safiyya Illyas and Sharrafuth Najiullah." />
    <meta property="og:title" content="Safiyya &amp; Sharrafuth — Wedding Invitation" />
    <meta property="og:description" content="You are cordially invited to the wedding ceremony of Safiyya Illyas and Sharrafuth Najiullah." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/invite_card_bg_poster.webp" />
    <meta property="og:image:alt" content="Safiyya &amp; Sharrafuth Wedding Invitation" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Safiyya &amp; Sharrafuth — Wedding Invitation" />
    <meta name="twitter:description" content="You are cordially invited to the wedding ceremony of Safiyya Illyas and Sharrafuth Najiullah." />
    <meta name="twitter:image" content="/assets/invite_card_bg_poster.webp" />
    
    <!-- Google Fonts Preconnect & Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Kaushan+Script&family=Josefin+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- High-Priority Critical Asset Preloading for Instant Door Experience (invitation routes only) -->
    <script>
      (function () {
        if (location.pathname.indexOf('/dashboard') === 0) return;
        var assets = [
          ['/assets/fancy_door_left.webp', 'high'],
          ['/assets/fancy_door_right.webp', 'high'],
          ['/assets/fancy_garden_palace.webp', 'high'],
          ['/assets/door_handle_crest_left.webp', 'high'],
          ['/assets/door_handle_crest_right.webp', 'high'],
          ['/assets/invite_card_bg_poster.webp', 'auto']
        ];
        assets.forEach(function (a) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.type = 'image/webp';
          l.href = a[0];
          l.setAttribute('fetchpriority', a[1]);
          document.head.appendChild(l);
        });
      })();
    </script>
  </head>
  <body class="bg-[#fdf9f5] text-[#2d1a22] font-body selection:bg-[#e8a4b4]/30 selection:text-[#b05570] overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
